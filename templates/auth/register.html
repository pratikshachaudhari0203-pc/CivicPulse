<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | CivicPulse</title>

    <link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/auth.css') }}">
</head>

<body class="auth-page">

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                <a href="/">
                    <img src="{{ url_for('static', filename='images/CivicPulse_logo.png') }}"
                         alt="CivicPulse">
                </a>
            </div>

            <h1>Create Account</h1>
            <p class="auth-subtitle">
                Join CivicPulse and help build a better community.
            </p>

            {% if error %}
                <div class="error-message">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST" action="/register">

                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Enter your full name"
                        minlength="3"
                        maxlength="100"
                        required>
                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            maxlength="100"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="10-digit phone number"
                            pattern="[0-9]{10}"
                            maxlength="10"
                            required>
                    </div>

                </div>

                <div class="form-group">
                    <label for="city">City</label>
                    <input
                        type="text"
                        id="city"
                        name="city"
                        placeholder="Enter your city"
                        maxlength="100"
                        required>
                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Minimum 8 characters"
                            minlength="8"
                            required>
                    </div>

                    <div class="form-group">
                        <label for="confirm_password">Confirm Password</label>
                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            placeholder="Confirm password"
                            minlength="8"
                            required>
                    </div>

                </div>

                  <div class="form-group">
    <label for="role">Register As</label>

    <select id="role" name="role" required>
        <option value="">Select your role</option>
        <option value="Citizen">Citizen</option>
        <option value="Officer">Officer</option>
    </select>
</div>

<div class="form-group" id="officer-code-group" style="display: none;">
    <label for="officer_code">Officer Authorization Code</label>

    <input
        type="password"
        id="officer_code"
        name="officer_code"
        placeholder="Enter officer authorization code">
</div>

                <label class="terms">
                    <input type="checkbox" name="terms" required>
                    <span>I agree to the CivicPulse terms and conditions.</span>
                </label>

                <button type="submit" class="auth-submit">
                    Create Account
                </button>

            </form>

            <p class="auth-footer">
                Already have an account?
                <a href="/login">Login</a>
            </p>

        </div>

    </div>
<script>
    const roleSelect = document.getElementById("role");
    const officerCodeGroup = document.getElementById("officer-code-group");
    const officerCode = document.getElementById("officer_code");

    roleSelect.addEventListener("change", function () {

        if (this.value === "Officer") {
            officerCodeGroup.style.display = "block";
            officerCode.required = true;
        } else {
            officerCodeGroup.style.display = "none";
            officerCode.required = false;
            officerCode.value = "";
        }

    });
</script>
</body>
</html>
